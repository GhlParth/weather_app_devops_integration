version: '3.8'

services:
  weather-app-dev:
    build: .
    container_name: weather-app-dev
    ports:
      - "${SERVER_PORT:-8082}:${SERVER_PORT:-8082}"
      # Expose LiveReload port for Spring Boot DevTools
      - "35729:35729"
    environment:
      - WEATHER_API_KEY=${WEATHER_API_KEY}
      - SPRING_PROFILES_ACTIVE=${SERVER_ENV:-dev}
      - SERVER_PORT=${SERVER_PORT:-8082}
    volumes:
      # Mount the current directory to /app in the container
      - .:/app
      # Cache Maven dependencies to avoid redownloading them on every restart
      - maven-repo:/root/.m2
    restart: unless-stopped

volumes:
  maven-repo:
