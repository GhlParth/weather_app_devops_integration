name: CI/CD to Docker Hub (Dev)

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean package -DskipTests
      
    - name: Run Tests
      run: mvn test

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/weather-app:dev
          ${{ secrets.DOCKERHUB_USERNAME }}/weather-app:${{ github.sha }}

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Stop any existing container
          docker stop weather-app-dev || true
          docker rm weather-app-dev || true
          
          # Pull the latest image
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/weather-app:dev
          
          # Run the container, using the .env.dev file manually placed on the server
          # Assuming it's in the home directory or project directory, adjust path if needed:
          docker run -d --name weather-app-dev -p 8082:8082 --env-file /home/ubuntu/weather_app/.env.dev --restart unless-stopped ${{ secrets.DOCKERHUB_USERNAME }}/weather-app:dev
